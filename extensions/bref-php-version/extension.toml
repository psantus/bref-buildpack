# Image Extension: Bref PHP Version Selector
#
# This extension dynamically switches the run image based on BP_PHP_VERSION.
# It generates a run.Dockerfile that selects the appropriate Bref base image.

api = "0.10"

[extension]
  id = "bref/php-version"
  version = "0.1.0"
  name = "Bref PHP Version Selector"
  description = "Switches the Bref run image based on the requested PHP version"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"
